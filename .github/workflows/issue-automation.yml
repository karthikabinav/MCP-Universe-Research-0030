name: Issue Label Automation
on:
  issues:
    types: [opened, labeled]
permissions:
  issues: write
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment based on label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(label => label.name);
            let comment = null;
            if (labels.includes('bug')) {
              comment = 'Thank you. We will fix it.';
            } else if (labels.includes('feature')) {
              comment = 'Thank you, we will consider to include this feature.';
            } else if (labels.includes('discussion')) {
              comment = 'Thanks for starting this discussion! We welcome community input.';
            }
            if (comment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: comment
              });
            }
