name: Issue Auto Comment

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post comment based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.issue.labels || []).map((label) => label.name);
            let message = null;
            if (labels.includes('bug')) {
              message = 'Thank you. We will fix it.';
            } else if (labels.includes('feature')) {
              message = 'Thank you, we will consider to include this feature.';
            } else if (labels.includes('discussion')) {
              message = 'Thanks for starting this discussion! We welcome community input.';
            }
            if (message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: message,
              });
            }
